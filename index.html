<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révisions Java PR70</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1d1b16; --muted:#6d685c; --line:#ddd6c6;
  --accent:#c2410c; --accent-soft:#fde7d9; --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2; --warn:#b45309; --warn-soft:#fef3c7;
  --code-bg:#1f1d1a; --code-ink:#ece6d8;
  --l1:#2563eb; --l2:#7c3aed; --l3:#c2410c; --l4:#0f766e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
p code, li code, .q code, .opt code, .expl code, td code{background:#ece6d8;padding:1px 5px;border-radius:4px;font-size:.88em}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px;flex-wrap:wrap}
header.top h1{font-size:28px;margin:0;letter-spacing:-.02em}
header.top h1 span{color:var(--accent)}
header.top .sub{color:var(--muted);font-size:14px}
.btn{font:inherit;font-weight:600;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer;transition:transform .05s}
.btn:hover{background:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#000}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:28px 0 10px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lvcard{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.lvcard .n{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:600;font-size:13px}
.lvcard .t{font-weight:600;margin-top:2px}
.lvcard .d{font-size:13px;color:var(--muted)}
.lvcard.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.lvcard:not(.on){opacity:.55}
@media (max-width:700px){.levels{grid-template-columns:1fr 1fr}}
table.grid{width:100%;border-collapse:collapse;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
table.grid th,table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid thead th{background:#ede8dc;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cell{display:inline-flex;align-items:center;gap:6px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
.bar{display:inline-block;width:46px;height:6px;background:#e6e0d2;border-radius:3px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;color:#fff}
.tag.l1{background:var(--l1)}.tag.l2{background:var(--l2)}.tag.l3{background:var(--l3)}.tag.l4{background:var(--l4)}
.tag.tp{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.progress{height:8px;background:#e6e0d2;border-radius:4px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:22px;box-shadow:5px 5px 0 var(--ink)}
.q{font-size:18px;font-weight:500;margin:4px 0 16px}
pre.code{background:var(--code-bg);color:var(--code-ink);border-radius:9px;padding:14px 0;margin:0 0 16px;overflow-x:auto;font-size:13.5px;line-height:1.6}
pre.code .ln{display:flex;padding:0 16px 0 0;min-height:1.6em}
pre.code .ln .no{width:40px;flex:none;text-align:right;padding-right:14px;color:#6f675a;user-select:none}
pre.code .ln .tx{white-space:pre;flex:1}
pre.code.review .ln{cursor:pointer;border-left:3px solid transparent}
pre.code.review .ln:hover{background:#2c2925}
pre.code.review .ln.sel{background:#3b2d16;border-left-color:#f59e0b}
pre.code.review .ln.hit{background:#14361f;border-left-color:#22c55e}
pre.code.review .ln.miss{background:#3a2a0b;border-left-color:#f59e0b;outline:1px dashed #f59e0b;outline-offset:-1px}
pre.code.review .ln.fp{background:#3d1717;border-left-color:#ef4444}
pre.code.review.done .ln{cursor:default}
.c-kw{color:#f0a36b;font-weight:600}.c-str{color:#a7d58a}.c-com{color:#857c6d;font-style:italic}.c-num{color:#e6c07b}.c-type{color:#8cc4ef}.c-ann{color:#d6a3e8}
input.blank{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;background:#2f2b26;color:#fff;border:none;border-bottom:2px solid #f0a36b;border-radius:3px 3px 0 0;padding:1px 5px;margin:0 1px;outline:none;min-width:3ch}
input.blank:focus{background:#3d3832}
input.blank.ok{border-bottom-color:#22c55e;background:#14361f}
input.blank.ko{border-bottom-color:#ef4444;background:#3d1717}
.solution{display:inline-block;font-size:12px;color:#86efac;margin-left:2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;font-weight:600}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.feedback{margin-top:18px;border-radius:9px;padding:14px 16px;border:1.5px solid}
.feedback.good{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--bad-soft);border-color:var(--bad)}
.feedback.mid{background:var(--warn-soft);border-color:var(--warn)}
.feedback b.v{display:block;margin-bottom:4px}
.buglist{list-style:none;padding:0;margin:10px 0 0}
.buglist li{padding:8px 0;border-top:1px solid rgba(0,0,0,.1)}
.buglist .st{font-weight:700;margin-right:6px}
.hint{font-size:14px;color:var(--muted);margin:-6px 0 12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6;margin-left:6px}
.end{text-align:center}
.end .big{font-size:56px;font-weight:700;letter-spacing:-.03em;margin:6px 0}
.end table{margin-top:18px}
.missed{text-align:left;margin-top:20px}
.missed li{margin:4px 0;font-size:14px}
.note{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Révisions Java <span>PR70</span></h1>
      <div class="sub">TP1 → TP7 · des bases à la lecture, la revue et la complétion de code</div>
    </div>
    <button class="btn ghost" id="homeBtn" onclick="showHome()">← Accueil</button>
  </header>

  <!-- ACCUEIL -->
  <section id="home">
    <h2>1 · Choisis les TP</h2>
    <div class="row" id="tpChips"></div>

    <h2>2 · Choisis les niveaux</h2>
    <div class="levels" id="lvCards"></div>

    <h2>3 · Lance-toi</h2>
    <div class="row">
      <button class="btn primary" onclick="start('parcours')">Parcours progressif <span class="kbd">niveau 1 → 4</span></button>
      <button class="btn" onclick="start('melange')">Tout mélangé</button>
      <button class="btn" id="errBtn" onclick="start('erreurs')">Refaire mes erreurs</button>
    </div>
    <p class="note" id="selInfo"></p>

    <h2>Ta progression</h2>
    <table class="grid" id="statTable"></table>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn ghost" onclick="resetStats()" style="font-size:13px;padding:6px 12px">Réinitialiser la progression</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qhead">
      <div class="row" id="qTags"></div>
      <div class="mono" id="qCount" style="font-size:14px;color:var(--muted)"></div>
    </div>
    <div class="progress"><i id="qBar"></i></div>
    <div class="card" id="qCard"></div>
  </section>

  <!-- FIN -->
  <section id="end" class="hidden"></section>
</div>

<script>
// Banque de questions — Révisions PR70 (TP1 → TP7)
// type: qcm | review | fill ; lvl: 1 bases, 2 lire le code, 3 revue de code, 4 code à trous
const R = String.raw;

const TPS = {
  1: "TP1 · Bases, Scanner, String, encapsulation",
  2: "TP2 · Héritage, abstraction, interfaces, polymorphisme",
  3: "TP3 · Exceptions & collections",
  4: "TP4 · Swing & calculatrice",
  5: "TP5 · Fichiers",
  6: "TP6 · Dessiner avec Java",
  7: "TP7 · Graphes & Dijkstra",
};

const QUESTIONS = [
/* =========================== TP1 =========================== */
{ id:"1-1-a", tp:1, lvl:1, type:"qcm",
  q:"Après <code>int age = sc.nextInt();</code> puis <code>String nom = sc.nextLine();</code>, le nom est vide sans que l'utilisateur ait pu taper. Pourquoi ?",
  options:[
    "nextInt() lit le nombre mais laisse le retour à la ligne '\\n' dans le buffer : nextLine() le lit immédiatement et renvoie une chaîne vide",
    "nextLine() doit toujours être appelé avant nextInt()",
    "Un Scanner ne peut lire qu'un seul type de donnée",
    "nextInt() vide le buffer, donc nextLine() n'a plus rien à lire"],
  answer:0,
  expl:"<code>nextInt()</code> s'arrête juste avant le <code>'\\n'</code> (touche Entrée). <code>nextLine()</code> lit jusqu'au prochain <code>'\\n'</code>… qui est déjà là : elle renvoie <code>\"\"</code>."},
{ id:"1-1-b", tp:1, lvl:1, type:"qcm",
  q:"Quelle correction règle le problème du <code>nextInt()</code> suivi d'un <code>nextLine()</code> ?",
  options:[
    "Ajouter un <code>sc.nextLine();</code> juste après le <code>nextInt()</code> pour consommer le '\\n' restant",
    "Remplacer <code>nextLine()</code> par <code>next()</code> dans tous les cas",
    "Créer un deuxième Scanner sur System.in",
    "Appeler <code>sc.close()</code> entre les deux lectures"],
  answer:0,
  expl:"Autre solution propre : tout lire avec <code>nextLine()</code> et convertir avec <code>Integer.parseInt(sc.nextLine())</code>. Créer un 2ᵉ Scanner ou fermer System.in pose d'autres problèmes."},
{ id:"1-1-c", tp:1, lvl:1, type:"qcm",
  q:"<code>String s1 = \"Hello\"; String s2 = \"Hello\";</code> — que vaut <code>s1 == s2</code> et pourquoi ?",
  options:[
    "true : les littéraux identiques sont partagés dans le <i>String pool</i>, s1 et s2 pointent vers le même objet",
    "false : == compare toujours le contenu caractère par caractère",
    "false : chaque littéral crée un nouvel objet sur le tas",
    "Erreur de compilation : on ne peut pas utiliser == sur des String"],
  answer:0,
  expl:"<code>==</code> compare les <b>références</b>. Les littéraux sont « internés » dans le pool : même référence. En revanche <code>new String(\"Hello\")</code> force un nouvel objet sur le tas → <code>s1 == s3</code> est false."},
{ id:"1-1-d", tp:1, lvl:1, type:"qcm",
  q:"Quelle est la bonne façon de comparer le <b>contenu</b> de deux chaînes ?",
  options:["<code>a.equals(b)</code>","<code>a == b</code>","<code>a.hashCode() == b</code>","<code>a.compareTo(b) == 1</code>"],
  answer:0, expl:"<code>equals</code> compare le contenu. <code>equalsIgnoreCase</code> ignore la casse. <code>compareTo</code> renvoie 0 quand les chaînes sont égales (pas 1)."},
{ id:"1-1-e", tp:1, lvl:1, type:"qcm",
  q:"Le thermomètre doit avoir un taux d'erreur aléatoire entre −0.5 et +0.5. Quelle expression convient ?",
  options:["<code>Math.random() - 0.5</code>","<code>Math.random() * 0.5</code>","<code>Math.random(-0.5, 0.5)</code>","<code>(int) Math.random() - 0.5</code>"],
  answer:0, expl:"<code>Math.random()</code> renvoie un double dans [0 ; 1[. On décale de −0.5 → [−0.5 ; 0.5[. <code>(int) Math.random()</code> vaut toujours 0."},
{ id:"1-1-f", tp:1, lvl:1, type:"qcm",
  q:"Que signifie <b>l'encapsulation</b> en orienté objet ?",
  options:[
    "Les attributs sont <code>private</code> et on y accède via des méthodes (getters/setters) qui contrôlent l'accès",
    "Toutes les classes sont dans le même fichier",
    "Les attributs sont <code>public</code> pour être faciles d'accès",
    "Une classe hérite d'une autre classe"],
  answer:0, expl:"On cache l'état interne : la classe garde le contrôle (validation dans les setters, invariants). C'est l'une des 3 erreurs de l'audit de code du TP1."},
{ id:"1-1-g", tp:1, lvl:1, type:"qcm",
  q:"Pour tester si une chaîne contient les 6 voyelles <b>sans tenir compte de la casse</b> (\"RYTHME\"), le plus simple est :",
  options:["Convertir d'abord avec <code>toLowerCase()</code> puis faire les <code>contains</code>","Utiliser <code>==</code> sur chaque caractère","Utiliser <code>equals(\"aeiouy\")</code>","Ce n'est pas possible avec la classe String"],
  answer:0, expl:"<code>mot.toLowerCase().contains(\"a\") && …</code>. Rappel : les String sont <b>immuables</b>, toLowerCase() renvoie une nouvelle chaîne."},

{ id:"1-2-a", tp:1, lvl:2, type:"qcm",
  q:"Qu'affiche ce code ?",
  code:R`String texte = "banana";
String motif = "ana";
int count = 0;
int pos = texte.indexOf(motif);
while (pos != -1) {
    count++;
    pos = texte.indexOf(motif, pos + 1);
}
System.out.println(count);`,
  options:["2","1","3","Boucle infinie"], answer:0,
  expl:"\"ana\" est trouvé à l'indice 1 puis à l'indice 3 (chevauchement possible car on repart de <code>pos + 1</code>). Avec <code>pos + motif.length()</code> on obtiendrait 1."},
{ id:"1-2-b", tp:1, lvl:2, type:"qcm",
  q:"Qu'affichent ces trois lignes ?",
  code:R`String s1 = "Java";
String s2 = new String("Java");
String s3 = s2;
System.out.println(s1 == s2);
System.out.println(s1.equals(s2));
System.out.println(s2 == s3);`,
  options:["false / true / true","true / true / true","false / true / false","false / false / true"], answer:0,
  expl:"s1 est dans le pool, s2 est un nouvel objet sur le tas → références différentes. Même contenu → equals true. s3 recopie la <b>référence</b> de s2 → même objet."},
{ id:"1-2-c", tp:1, lvl:2, type:"qcm",
  q:"Qu'affiche ce code ?",
  code:R`int a = 7, b = 2;
double r = a / b;
System.out.println(r);`,
  options:["3.0","3.5","3","Erreur de compilation"], answer:0,
  expl:"<code>a / b</code> est une division <b>entière</b> (int/int = 3), convertie ensuite en double → 3.0. Il faut caster : <code>(double) a / b</code>. C'est exactement le <code>(float) dividende / diviseur</code> du TP3."},
{ id:"1-2-d", tp:1, lvl:2, type:"qcm",
  q:"Qu'affiche ce code ?",
  code:R`String mot = "RYTHME";
boolean ok = mot.contains("y") && mot.contains("e");
System.out.println(ok);`,
  options:["false","true","Erreur à l'exécution","RYTHME"], answer:0,
  expl:"<code>contains</code> est sensible à la casse : \"RYTHME\" contient \"Y\" mais pas \"y\". Correction : <code>mot.toLowerCase().contains(\"y\")</code>."},
{ id:"1-2-e", tp:1, lvl:2, type:"qcm",
  q:"Thermomètre défectueux : qu'affiche ce code ?",
  code:R`double f = 212;
double c = (f - 32) / 1.8;
double tauxErreur = -0.2;
System.out.println(c + tauxErreur);`,
  options:["99.8","100.0","100.2","211.8"], answer:0,
  expl:"(212 − 32) / 1.8 = 100 °C, puis on ajoute le taux d'erreur −0.2 → 99.8."},

{ id:"1-3-a", tp:1, lvl:3, type:"review",
  q:"Audit du code « généré par IA » du TP1 : il compile mais contient <b>3 erreurs graves</b> (encapsulation, mémoire/exception, comparaison d'objets). Clique sur les lignes fautives.",
  code:R`class Etudiant {
    public String nom;
    public String prenom;
    public int age;

    public Etudiant(String n, String p, int a) {
        nom = n; prenom = p; age = a;
    }
}

class Groupe {
    public Etudiant[] liste;

    public Groupe(int tailleMax) {
        liste = new Etudiant[tailleMax];
    }

    public Etudiant chercherParNom(String nomRecherche) {
        for (int i = 0; i < liste.length; i++) {
            if (liste[i] != null && liste[i].nom == nomRecherche) {
                return liste[i];
            }
        }
        return null;
    }

    public double calculAgeMoyen() {
        double somme = 0;
        for (int i = 0; i < liste.length; i++) {
            somme = somme + liste[i].age;
        }
        return somme / liste.length;
    }
}`,
  bugs:[
    {lines:[2,3,4,12], label:"Encapsulation violée", expl:"Attributs <code>public</code> : n'importe qui peut écrire <code>e.age = -5</code>. Il faut <code>private</code> + getters/setters (et valider l'âge)."},
    {lines:[20], label:"Comparaison de String avec ==", expl:"<code>==</code> compare les références : une chaîne saisie au clavier ne sera jamais <code>==</code> au nom stocké. Utiliser <code>getNom().equals(nomRecherche)</code>."},
    {lines:[30,32], label:"NullPointerException + moyenne fausse", expl:"Le tableau a des cases <code>null</code> (groupe pas plein) → <code>liste[i].age</code> lève une NullPointerException. Il faut tester <code>!= null</code>, compter les étudiants réels et diviser par ce compte (et gérer le cas 0)."}
  ]},

{ id:"1-4-a", tp:1, lvl:4, type:"fill",
  q:"Corrige la lecture âge puis nom (problème du buffer du Scanner).",
  code:R`Scanner sc = new Scanner([[0]]);
System.out.print("Âge : ");
int age = sc.[[1]]();
sc.[[2]]();          // consomme le '\n' resté dans le buffer
System.out.print("Nom : ");
String nom = sc.nextLine();
System.out.println("Vous vous appelez " + nom + " et vous avez " + age + " ans.");`,
  answers:[["System.in"],["nextInt"],["nextLine"]],
  expl:"Le <code>sc.nextLine()</code> « à vide » absorbe le retour à la ligne laissé par <code>nextInt()</code>."},
{ id:"1-4-b", tp:1, lvl:4, type:"fill",
  q:"Corrige l'audit : encapsulation + comparaison de chaînes.",
  code:R`public class Etudiant {
    [[0]] String nom;
    [[0]] int age;

    public String getNom() {
        [[1]]
    }
}

// dans Groupe.chercherParNom
if (liste[i] != null && liste[i].getNom().[[2]](nomRecherche)) {
    return liste[i];
}`,
  answers:[["private"],["return nom;","return this.nom;"],["equals","equalsIgnoreCase"]],
  expl:"Les blancs numérotés pareil attendent la même réponse. <code>equals</code> compare le contenu, pas l'adresse."},
{ id:"1-4-c", tp:1, lvl:4, type:"fill",
  q:"Addition de matrices de capteurs : toute somme négative est forcée à 0 avec une alerte.",
  code:R`public Matrice additionner(Matrice autre) {
    Matrice res = new Matrice(lignes, colonnes);
    for (int i = 0; i < [[0]]; i++) {
        for (int j = 0; j < [[1]]; j++) {
            double somme = this.data[i][j] + [[2]];
            if ([[3]]) {
                System.out.println("[ALERTE] Défaillance du capteur à la position ("
                                   + i + ", " + j + ") corrigée.");
                somme = 0;
            }
            res.data[i][j] = somme;
        }
    }
    return res;
}`,
  answers:[["lignes","this.lignes","data.length","this.data.length"],["colonnes","this.colonnes","data[0].length","this.data[0].length","data[i].length"],["autre.data[i][j]"],["somme < 0","somme < 0.0","0 > somme"]],

<script>
const LV = {
  1:{n:"Niveau 1",t:"Bases",d:"QCM de cours et de concepts"},
  2:{n:"Niveau 2",t:"Lire le code",d:"Que fait / qu'affiche ce code ?"},
  3:{n:"Niveau 3",t:"Revue de code",d:"Clique sur les lignes fautives"},
  4:{n:"Niveau 4",t:"Code à trous",d:"Complète le code manquant"},
};
const state = { tps:new Set([1,2,3,4,5,6,7]), lvls:new Set([1,2,3,4]), queue:[], i:0, results:[], answered:false };

/* ---------- stockage (facultatif) ---------- */
let STATS = {};
try { STATS = JSON.parse(localStorage.getItem("pr70-java-stats") || "{}"); } catch(e) { STATS = {}; }
function saveStats(){ try { localStorage.setItem("pr70-java-stats", JSON.stringify(STATS)); } catch(e){} }
function resetStats(){ STATS = {}; saveStats(); renderHome(); }

/* ---------- utilitaires ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW = new Set("abstract boolean break case catch char class continue default do double else extends final finally float for if implements import instanceof int interface long new null package private protected public return static super switch this throw throws true false try void while var".split(" "));
function hl(src){
  const re = /(\/\/.*$)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(@\w+)|(\b\d+(?:\.\d+)?(?:e\d+)?[fFdDlL]?\b)|(\b[A-Za-z_]\w*\b)/gm;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0]; let c = "";
    if (m[1]) c = "c-com"; else if (m[2] || m[3]) c = "c-str"; else if (m[4]) c = "c-ann";
    else if (m[5]) c = "c-num"; else if (m[6]) c = KW.has(t) ? "c-kw" : (/^[A-Z]/.test(t) ? "c-type" : "");
    out += c ? `<span class="${c}">${esc(t)}</span>` : esc(t);
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const norm = s => s.replace(/\s+/g, "").replace(/;+$/, "");
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function codeBlock(src, cls){
  return `<pre class="code ${cls||""}">` + src.split("\n").map((l, i) =>
    `<div class="ln" data-l="${i+1}"><span class="no">${i+1}</span><span class="tx">${hl(l) || " "}</span></div>`).join("") + `</pre>`;
}

/* ---------- accueil ---------- */
function renderHome(){
  const chips = document.getElementById("tpChips");
  chips.innerHTML = `<button class="chip ${state.tps.size===7?"on":""}" onclick="toggleAllTp()">Tous</button>` +
    Object.keys(TPS).map(k => `<button class="chip ${state.tps.has(+k)?"on":""}" onclick="toggleTp(${k})" title="${TPS[k]}">TP${k}</button>`).join("");
  document.getElementById("lvCards").innerHTML = Object.keys(LV).map(k =>
    `<button class="lvcard ${state.lvls.has(+k)?"on":""}" onclick="toggleLv(${k})">
      <div class="n"><span class="tag l${k}">${LV[k].n}</span></div>
      <div class="t">${LV[k].t}</div><div class="d">${LV[k].d}</div></button>`).join("");
  const sel = pool();
  const errs = sel.filter(q => STATS[q.id] === 0).length;
  document.getElementById("selInfo").textContent = `${sel.length} question(s) sélectionnée(s) · ${errs} à retravailler`;
  document.getElementById("errBtn").disabled = errs === 0;

  let h = `<thead><tr><th>TP</th>${Object.keys(LV).map(k=>`<th>${LV[k].t}</th>`).join("")}<th>Total</th></tr></thead><tbody>`;
  for (const t of Object.keys(TPS)) {
    h += `<tr><td><b>TP${t}</b> <span class="note">${TPS[t].split("·")[1]}</span></td>`;
    let tot = 0, ok = 0;
    for (const l of Object.keys(LV)) {
      const qs = QUESTIONS.filter(q => q.tp == t && q.lvl == l);
      const good = qs.filter(q => STATS[q.id] === 1).length;
      tot += qs.length; ok += good;
      h += `<td>${qs.length ? `<span class="cell">${good}/${qs.length}<span class="bar"><i style="width:${100*good/qs.length}%"></i></span></span>` : "—"}</td>`;
    }
    h += `<td><span class="cell"><b>${ok}/${tot}</b></span></td></tr>`;
  }
  document.getElementById("statTable").innerHTML = h + "</tbody>";
}
function toggleTp(k){ state.tps.has(k) ? state.tps.delete(k) : state.tps.add(k); renderHome(); }
function toggleAllTp(){ state.tps = state.tps.size === 7 ? new Set() : new Set([1,2,3,4,5,6,7]); renderHome(); }
function toggleLv(k){ state.lvls.has(k) ? state.lvls.delete(k) : state.lvls.add(k); renderHome(); }
function pool(){ return QUESTIONS.filter(q => state.tps.has(q.tp) && state.lvls.has(q.lvl)); }

function show(id){ for (const s of ["home","quiz","end"]) document.getElementById(s).classList.toggle("hidden", s !== id); window.scrollTo(0,0); }
function showHome(){ renderHome(); show("home"); }

function start(mode){
  let qs = pool();
  if (mode === "erreurs") qs = qs.filter(q => STATS[q.id] === 0);
  if (!qs.length) return;
  if (mode === "melange") qs = shuffle(qs);
  else qs = [1,2,3,4].flatMap(l => shuffle(qs.filter(q => q.lvl === l)));
  state.queue = qs; state.i = 0; state.results = [];
  show("quiz"); renderQ();
}

/* ---------- question ---------- */
function renderQ(){
  const q = state.queue[state.i];
  state.answered = false;
  document.getElementById("qTags").innerHTML = `<span class="tag tp">TP${q.tp}</span><span class="tag l${q.lvl}">${LV[q.lvl].n} · ${LV[q.lvl].t}</span>`;
  document.getElementById("qCount").textContent = `${state.i + 1} / ${state.queue.length}`;
  document.getElementById("qBar").style.width = `${100 * state.i / state.queue.length}%`;
  const card = document.getElementById("qCard");
  let h = `<div class="q">${q.q}</div>`;

  if (q.type === "qcm") {
    if (q.code) h += codeBlock(q.code);
    q._order = shuffle(q.options.map((_, i) => i));
    h += `<div class="opts">` + q._order.map((oi, k) =>
      `<button class="opt" data-oi="${oi}" onclick="answerQcm(${oi})"><span class="k">${"ABCD"[k]}</span><span>${q.options[oi]}</span></button>`).join("") + `</div>`;
    h += `<p class="note" style="margin-top:12px">Raccourci : touches A B C D</p>`;
  }
  else if (q.type === "review") {
    h += `<p class="hint">Clique sur une ou plusieurs lignes pour les marquer, puis valide. Une seule ligne par problème suffit.</p>`;
    h += codeBlock(q.code, "review");
    h += `<div class="actions"><button class="btn primary" id="validBtn" onclick="answerReview()">Valider <span class="kbd">Entrée</span></button></div>`;
  }
  else if (q.type === "fill") {
    h += `<p class="hint">Complète les blancs (les blancs de même numéro attendent la même réponse). Tab pour passer au suivant.</p>`;
    h += fillBlock(q);
    h += `<div class="actions"><button class="btn ghost" onclick="answerFill(true)">Voir la solution</button><button class="btn primary" onclick="answerFill(false)">Valider <span class="kbd">Entrée</span></button></div>`;
  }
  h += `<div id="fb"></div>`;
  card.innerHTML = h;

  if (q.type === "review") card.querySelectorAll("pre.review .ln").forEach(el => el.onclick = () => { if (!state.answered) el.classList.toggle("sel"); });
  if (q.type === "fill") { const f = card.querySelector("input.blank"); if (f) f.focus(); }
}

function fillBlock(q){
  const lines = q.code.split("\n");
  return `<pre class="code">` + lines.map((line, i) => {
    const parts = line.split(/\[\[(\d+)\]\]/);
    let tx = "";
    parts.forEach((p, k) => {
      if (k % 2 === 0) tx += hl(p);
      else { const w = Math.max(4, Math.max(...q.answers[+p].map(a => a.length)) + 1);
        tx += `<input class="blank" data-b="${p}" style="width:${w}ch" spellcheck="false" autocomplete="off" placeholder="${+p+1}">`; }
    });
    return `<div class="ln"><span class="no">${i+1}</span><span class="tx">${tx || " "}</span></div>`;
  }).join("") + `</pre>`;
}

/* ---------- correction ---------- */
function record(ok){
  state.results.push({ q: state.queue[state.i], ok });
  STATS[state.queue[state.i].id] = ok ? 1 : 0; saveStats();
  state.answered = true;
}
function nextBtn(){
  const last = state.i === state.queue.length - 1;
  return `<div class="actions"><button class="btn primary" id="nextBtn" onclick="next()">${last ? "Voir le bilan" : "Question suivante"} <span class="kbd">Entrée</span></button></div>`;
}
function answerQcm(oi){
  if (state.answered) return;
  const q = state.queue[state.i]; const ok = oi === q.answer;
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true; const v = +b.dataset.oi;
    if (v === q.answer) b.classList.add("right"); else if (v === oi) b.classList.add("wrong");
  });
  record(ok);
  document.getElementById("fb").innerHTML = `<div class="feedback ${ok?"good":"bad"} expl"><b class="v">${ok?"✓ Correct":"✗ Raté"}</b>${q.expl}</div>` + nextBtn();
}
function answerReview(){
  if (state.answered) return;
  const q = state.queue[state.i];
  const lines = [...document.querySelectorAll("pre.review .ln")];
  const sel = new Set(lines.filter(l => l.classList.contains("sel")).map(l => +l.dataset.l));
  const bugLines = new Set(q.bugs.flatMap(b => b.lines));
  const found = q.bugs.map(b => b.lines.some(l => sel.has(l)));
  const fp = [...sel].filter(l => !bugLines.has(l));
  lines.forEach(el => {
    const n = +el.dataset.l; el.classList.remove("sel");
    const gi = q.bugs.findIndex(b => b.lines.includes(n));
    if (gi >= 0) el.classList.add(found[gi] ? "hit" : "miss");
    else if (sel.has(n)) el.classList.add("fp");
  });
  document.querySelector("pre.review").classList.add("done");
  const nFound = found.filter(Boolean).length;
  const ok = nFound === q.bugs.length && fp.length <= 1;
  record(ok);
  const cls = ok ? "good" : (nFound > 0 ? "mid" : "bad");
  let h = `<div class="feedback ${cls}"><b class="v">${nFound}/${q.bugs.length} problème(s) trouvé(s)${fp.length ? ` · ${fp.length} ligne(s) marquée(s) à tort (en rouge)` : ""}</b>
    <span class="note">Vert = trouvé · pointillés orange = manqué</span><ul class="buglist">`;
  q.bugs.forEach((b, i) => { h += `<li><span class="st" style="color:${found[i]?"var(--ok)":"var(--warn)"}">${found[i]?"✓":"○"} ${b.label}</span><span class="note">(l. ${b.lines.join(", ")})</span><br>${b.expl}</li>`; });
  document.getElementById("fb").innerHTML = h + `</ul></div>` + nextBtn();
  document.getElementById("validBtn").classList.add("hidden");
}
function answerFill(reveal){
  if (state.answered) return;
  const q = state.queue[state.i];
  const inputs = [...document.querySelectorAll("input.blank")];
  let nOk = 0;
  inputs.forEach(inp => {
    const acc = q.answers[+inp.dataset.b]; const good = acc.some(a => norm(a) === norm(inp.value));
    if (good && !reveal) nOk++;
    inp.classList.add(good && !reveal ? "ok" : "ko"); inp.readOnly = true;
    if (!good || reveal) inp.insertAdjacentHTML("afterend", `<span class="solution">→ ${esc(acc[0])}</span>`);
  });
  const ok = !reveal && nOk === inputs.length;
  record(ok);
  const alts = q.answers.map((a, i) => a.length > 1 ? `<li><b>Blanc ${i+1}</b> : ${a.map(x => `<code>${esc(x)}</code>`).join(" ou ")}</li>` : "").join("");
  document.getElementById("fb").innerHTML = `<div class="feedback ${ok?"good":(nOk?"mid":"bad")} expl"><b class="v">${reveal ? "Solution affichée (comptée comme à revoir)" : `${nOk}/${inputs.length} blanc(s) correct(s)`}</b>${q.expl}${alts ? `<ul style="margin:8px 0 0;padding-left:18px">${alts}</ul>` : ""}</div>` + nextBtn();
  document.querySelectorAll("#qCard .actions")[0].classList.add("hidden");
}
function next(){
  if (state.i < state.queue.length - 1) { state.i++; renderQ(); window.scrollTo({top:0,behavior:"smooth"}); }
  else renderEnd();
}

/* ---------- bilan ---------- */
function renderEnd(){
  const r = state.results, ok = r.filter(x => x.ok).length;
  const pct = Math.round(100 * ok / r.length);
  let h = `<div class="card end"><div class="note">Bilan de la série</div><div class="big">${ok} / ${r.length}</div>
    <div>${pct >= 85 ? "Excellent, tu maîtrises 💪" : pct >= 60 ? "Solide — retravaille les erreurs ci-dessous." : "Il faut revoir ces notions : relance « Refaire mes erreurs »."}</div>
    <table class="grid"><thead><tr><th>Niveau</th><th>Réussies</th></tr></thead><tbody>`;
  for (const l of [1,2,3,4]) { const s = r.filter(x => x.q.lvl === l); if (s.length) h += `<tr><td><span class="tag l${l}">${LV[l].n}</span> ${LV[l].t}</td><td class="mono">${s.filter(x=>x.ok).length} / ${s.length}</td></tr>`; }
  h += `</tbody></table>`;
  const miss = r.filter(x => !x.ok);
  if (miss.length) h += `<div class="missed"><b>À revoir :</b><ul>${miss.map(x => `<li><span class="tag tp">TP${x.q.tp}</span> <span class="tag l${x.q.lvl}">N${x.q.lvl}</span> ${x.q.q.replace(/<[^>]+>/g,"").slice(0,110)}…</li>`).join("")}</ul></div>`;
  h += `<div class="actions" style="justify-content:center"><button class="btn" onclick="showHome()">Accueil</button>${miss.length ? `<button class="btn primary" onclick="retryMissed()">Refaire ces ${miss.length} erreur(s)</button>` : ""}</div></div>`;
  document.getElementById("end").innerHTML = h;
  show("end");
}
function retryMissed(){
  state.queue = state.results.filter(x => !x.ok).map(x => x.q); state.i = 0; state.results = [];
  show("quiz"); renderQ();
}

/* ---------- clavier ---------- */
document.addEventListener("keydown", e => {
  if (document.getElementById("quiz").classList.contains("hidden")) return;
  const q = state.queue[state.i];
  if (e.key === "Enter") {
    e.preventDefault();
    if (state.answered) return next();
    if (q.type === "review") answerReview();
    if (q.type === "fill") answerFill(false);
  } else if (q.type === "qcm" && !state.answered && /^[abcd]$/i.test(e.key) && document.activeElement.tagName !== "INPUT") {
    const k = "abcd".indexOf(e.key.toLowerCase()); if (q._order[k] !== undefined) answerQcm(q._order[k]);
  }
});

renderHome();
</script>
